<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Taxi Service - Управление водителями, пассажирами и поездками">
    <title>Taxi Service - Сервис Такси</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">TaxiPro</div>
                <nav id="mainNav">
                    <button class="nav-btn active" data-section="home">Главная</button>
                    <button class="nav-btn" data-section="drivers">Водители</button>
                    <button class="nav-btn" data-section="passengers">Пассажиры</button>
                    <button class="nav-btn" data-section="trips">Поездки</button>
                </nav>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Home Section -->
        <section id="home" class="section active">
            <div class="hero">
                <h1>Добро пожаловать в TaxiPro</h1>
                <p>Современная система управления службой такси</p>
                <div class="hero-buttons">
                    <button class="btn btn-primary" onclick="switchSection('trips')">
                        ✨ Создать поездку
                    </button>
                    <button class="btn btn-secondary" onclick="switchSection('drivers')">
                        🚗 Управление водителями
                    </button>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="totalDrivers">0</div>
                    <div class="stat-label">Водителей</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="availableDrivers">0</div>
                    <div class="stat-label">Доступно</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalPassengers">0</div>
                    <div class="stat-label">Пассажиров</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalTrips">0</div>
                    <div class="stat-label">Поездок</div>
                </div>
            </div>
        </section>

        <!-- Drivers Section -->
        <section id="drivers" class="section">
            <div class="section-header">
                <h2 class="section-title">Водители</h2>
                <button class="btn btn-primary" onclick="showDriverForm()">
                    ➕ Добавить водителя
                </button>
            </div>

            <div id="driverFormContainer" style="display: none;">
                <div class="form-section">
                    <div class="form-card">
                        <h3 class="form-title">Новый водитель</h3>
                        <form id="driverForm">
                            <div class="form-group">
                                <label class="form-label">Имя</label>
                                <input type="text" class="form-input" id="driverName" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Телефон</label>
                                <input type="tel" class="form-input" id="driverPhone" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Номер лицензии</label>
                                <input type="text" class="form-input" id="driverLicense" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Модель автомобиля</label>
                                <input type="text" class="form-input" id="driverCarModel" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Номер автомобиля</label>
                                <input type="text" class="form-input" id="driverCarNumber" required>
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary">Сохранить</button>
                                <button type="button" class="btn btn-secondary" onclick="hideDriverForm()">Отмена</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div id="driversContainer" class="cards-grid"></div>
        </section>

        <!-- Passengers Section -->
        <section id="passengers" class="section">
            <div class="section-header">
                <h2 class="section-title">Пассажиры</h2>
                <button class="btn btn-primary" onclick="showPassengerForm()">
                    ➕ Зарегистрировать пассажира
                </button>
            </div>

            <div id="passengerFormContainer" style="display: none;">
                <div class="form-section">
                    <div class="form-card">
                        <h3 class="form-title">Регистрация пассажира</h3>
                        <form id="passengerForm">
                            <div class="form-group">
                                <label class="form-label">Имя</label>
                                <input type="text" class="form-input" id="passengerName" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Телефон</label>
                                <input type="tel" class="form-input" id="passengerPhone" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-input" id="passengerEmail" required>
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary">Зарегистрировать</button>
                                <button type="button" class="btn btn-secondary" onclick="hidePassengerForm()">Отмена</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div id="passengersContainer" class="cards-grid"></div>
        </section>

        <!-- Trips Section -->
        <section id="trips" class="section">
            <div class="section-header">
                <h2 class="section-title">Поездки</h2>
                <button class="btn btn-primary" onclick="showTripForm()">
                    ➕ Создать поездку
                </button>
            </div>

            <div id="tripFormContainer" style="display: none;">
                <div class="form-section">
                    <div class="form-card">
                        <h3 class="form-title">Новая поездка</h3>
                        <form id="tripForm">
                            <div class="form-group">
                                <label class="form-label">Пассажир</label>
                                <select class="form-select" id="tripPassenger" required>
                                    <option value="">Выберите пассажира</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Откуда</label>
                                <input type="text" class="form-input" id="tripPickup" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Куда</label>
                                <input type="text" class="form-input" id="tripDropoff" required>
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary">Создать</button>
                                <button type="button" class="btn btn-secondary" onclick="hideTripForm()">Отмена</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div id="tripsContainer" class="cards-grid"></div>
        </section>
    </main>

    <script src="scripts/app.js"></script>
    <script src="scripts/drivers.js"></script>
    <script src="scripts/passengers.js"></script>
    <script src="scripts/trips.js"></script>
</body>
</html>
